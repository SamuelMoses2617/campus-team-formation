<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | CampusEvent</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
        }
        
        .notification-item {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .notification-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }
        
        .notification-unread {
            border-left: 3px solid #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; }
    </style>
</head>
<body class="animated-bg min-h-screen">
    
    <div class="container mx-auto px-4 py-6">
        <div class="max-w-4xl mx-auto">
            
            <!-- Header -->
            <div class="glass-card p-4 mb-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                            <span class="text-2xl">🔔</span>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-white">Notifications</h1>
                            <p class="text-white/60 text-sm">Stay updated with your events and team updates</p>
                        </div>
                    </div>
                    <button onclick="markAllAsRead()" class="btn-primary px-4 py-2 rounded-lg text-white text-sm font-semibold">
                        Mark All as Read
                    </button>
                </div>
            </div>
            
            <!-- Notification Filters -->
            <div class="glass-card p-4 mb-6">
                <div class="flex gap-3 flex-wrap">
                    <button onclick="filterNotifications('all')" id="filterAll" class="px-4 py-2 rounded-lg text-white bg-white/20 font-medium text-sm">All</button>
                    <button onclick="filterNotifications('team_selected')" id="filterTeam" class="px-4 py-2 rounded-lg text-white/70 hover:bg-white/10 font-medium text-sm">Team Selected</button>
                    <button onclick="filterNotifications('event_update')" id="filterEvent" class="px-4 py-2 rounded-lg text-white/70 hover:bg-white/10 font-medium text-sm">Event Updates</button>
                    <button onclick="filterNotifications('announcement')" id="filterAnnouncement" class="px-4 py-2 rounded-lg text-white/70 hover:bg-white/10 font-medium text-sm">Announcements</button>
                </div>
            </div>
            
            <!-- Notifications List -->
            <div id="notificationsList" class="space-y-3">
                <!-- Notifications will be loaded here -->
            </div>
            
        </div>
    </div>
    
    <script>
        const API = "/api";
        function token() { return localStorage.getItem("token"); }

        async function loadNotifications() {
            try {
                const res = await fetch(`${API}/notifications`, { headers: { Authorization: `Bearer ${token()}` } });
                if (!res.ok) { renderEmpty(); return; }
                const data = await res.json();
                renderNotifications(data || []);
            } catch(e) { renderEmpty(); }
        }

        function renderNotifications(notifications) {
            const container = document.getElementById('notificationsList');
            if (notifications.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 text-center">
                        <h3 class="text-white text-xl font-semibold mb-2">No Notifications</h3>
                        <p class="text-white/50">You're all caught up!</p>
                    </div>
                `;
                return;
            }
            container.innerHTML = notifications.map(n => `
                <div class="glass-card notification-item ${!n.read ? 'notification-unread' : ''} p-4">
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl flex items-center justify-center flex-shrink-0">
                            <span class="text-white font-bold text-lg">${n.type === 'team' ? 'T' : n.type === 'registration' ? 'R' : 'N'}</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between mb-1">
                                <h3 class="text-white font-semibold">${n.type.toUpperCase()}</h3>
                                ${!n.read ? '<span class="bg-blue-500 text-white text-xs px-2 py-1 rounded-full">New</span>' : ''}
                            </div>
                            <p class="text-white/70 text-sm mb-2">${n.message}</p>
                            <div class="flex items-center gap-4">
                                <span class="text-white/40 text-xs">${n.createdAt ? new Date(n.createdAt).toLocaleDateString() : ''}</span>
                                ${!n.read ? `<button onclick="markRead('${n.id}')" class="text-blue-400 hover:text-blue-300 text-xs">Mark read</button>` : ''}
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            updateUnreadCount(notifications);
        }

        async function markRead(id) {
            try { await fetch(`${API}/notifications/${id}`, { method: "PUT", headers: { Authorization: `Bearer ${token()}` } }); } catch(e) {}
            await loadNotifications();
        }

        async function markAllAsRead() {
            try { await fetch(`${API}/notifications/read-all`, { method: "PUT", headers: { Authorization: `Bearer ${token()}` } }); } catch(e) {}
            await loadNotifications();
        }

        function updateUnreadCount(notifications) {
            const unread = notifications.filter(n => !n.read).length;
            document.title = unread > 0 ? `(${unread}) Notifications | CampusEvent` : 'Notifications | CampusEvent';
        }

        function renderEmpty() {
            document.getElementById('notificationsList').innerHTML = `
                <div class="glass-card p-8 text-center">
                    <h3 class="text-white text-xl font-semibold mb-2">No Notifications</h3>
                    <p class="text-white/50">You're all caught up!</p>
                </div>
            `;
        }

        loadNotifications();
    </script>
</body>
</html>
