<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications | CampusEvent</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
        }
        
        .notification-item {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .notification-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }
        
        .notification-unread {
            border-left: 3px solid #3b82f6;
            background: rgba(59, 130, 246, 0.05);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; }
    </style>
</head>
<body class="animated-bg min-h-screen">
    
    <div class="container mx-auto px-4 py-6">
        <div class="max-w-4xl mx-auto">
            
            <!-- Header -->
            <div class="glass-card p-4 mb-6">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                            <span class="text-2xl">🔔</span>
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-white">Notifications</h1>
                            <p class="text-white/60 text-sm">Stay updated with your events and team updates</p>
                        </div>
                    </div>
                    <button onclick="markAllAsRead()" class="btn-primary px-4 py-2 rounded-lg text-white text-sm font-semibold">
                        Mark All as Read
                    </button>
                </div>
            </div>
            
            <!-- Notification Filters -->
            <div class="glass-card p-4 mb-6">
                <div class="flex gap-3 flex-wrap">
                    <button onclick="filterNotifications('all')" id="filterAll" class="px-4 py-2 rounded-lg text-white bg-white/20 font-medium text-sm">All</button>
                    <button onclick="filterNotifications('team_selected')" id="filterTeam" class="px-4 py-2 rounded-lg text-white/70 hover:bg-white/10 font-medium text-sm">Team Selected</button>
                    <button onclick="filterNotifications('event_update')" id="filterEvent" class="px-4 py-2 rounded-lg text-white/70 hover:bg-white/10 font-medium text-sm">Event Updates</button>
                    <button onclick="filterNotifications('announcement')" id="filterAnnouncement" class="px-4 py-2 rounded-lg text-white/70 hover:bg-white/10 font-medium text-sm">Announcements</button>
                </div>
            </div>
            
            <!-- Notifications List -->
            <div id="notificationsList" class="space-y-3">
                <!-- Notifications will be loaded here -->
            </div>
            
        </div>
    </div>
    
    <script>
        // Mock Notifications Data
        let notifications = [
            {
                id: 1,
                title: 'Team Selected! 🎉',
                message: 'Congratulations! You have been selected for Team "Code Warriors" in AI Hackathon 2025.',
                type: 'team_selected',
                isRead: false,
                time: '2 hours ago',
                icon: '👥',
                color: 'from-green-500 to-emerald-500'
            },
            {
                id: 2,
                title: 'Registration Confirmed',
                message: 'Your registration for Web Development Workshop has been approved.',
                type: 'event_update',
                isRead: false,
                time: '1 day ago',
                icon: '✅',
                color: 'from-blue-500 to-cyan-500'
            },
            {
                id: 3,
                title: 'Important Announcement',
                message: 'Orientation session for AI Hackathon on Jan 14th at 10 AM in Main Auditorium.',
                type: 'announcement',
                isRead: true,
                time: '2 days ago',
                icon: '📢',
                color: 'from-purple-500 to-pink-500'
            },
            {
                id: 4,
                title: 'Team Meeting Scheduled',
                message: 'Team "Code Warriors" meeting scheduled for tomorrow at 3 PM.',
                type: 'team_selected',
                isRead: true,
                time: '3 days ago',
                icon: '📅',
                color: 'from-orange-500 to-red-500'
            },
            {
                id: 5,
                title: 'Event Deadline Extended',
                message: 'The registration deadline for Tech Ideathon has been extended to Feb 8th.',
                type: 'event_update',
                isRead: false,
                time: '4 days ago',
                icon: '⏰',
                color: 'from-yellow-500 to-orange-500'
            },
            {
                id: 6,
                title: 'New Resource Available',
                message: 'Study materials for Web Development Workshop are now available.',
                type: 'announcement',
                isRead: true,
                time: '5 days ago',
                icon: '📚',
                color: 'from-teal-500 to-cyan-500'
            }
        ];
        
        let currentFilter = 'all';
        
        // Render notifications
        function renderNotifications() {
            const container = document.getElementById('notificationsList');
            let filtered = notifications;
            
            if (currentFilter !== 'all') {
                filtered = notifications.filter(n => n.type === currentFilter);
            }
            
            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="glass-card p-8 text-center">
                        <div class="text-6xl mb-4">🔔</div>
                        <h3 class="text-white text-xl font-semibold mb-2">No Notifications</h3>
                        <p class="text-white/50">You're all caught up!</p>
                    </div>
                `;
                return;
            }
            
            container.innerHTML = filtered.map(notif => `
                <div class="glass-card notification-item ${!notif.isRead ? 'notification-unread' : ''} p-4" onclick="markAsRead(${notif.id})">
                    <div class="flex items-start gap-4">
                        <div class="w-12 h-12 bg-gradient-to-r ${notif.color} rounded-xl flex items-center justify-center flex-shrink-0">
                            <span class="text-xl">${notif.icon}</span>
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center justify-between mb-1">
                                <h3 class="text-white font-semibold">${notif.title}</h3>
                                ${!notif.isRead ? '<span class="bg-blue-500 text-white text-xs px-2 py-1 rounded-full">New</span>' : ''}
                            </div>
                            <p class="text-white/70 text-sm mb-2">${notif.message}</p>
                            <div class="flex items-center gap-4">
                                <span class="text-white/40 text-xs">${notif.time}</span>
                                <button onclick="event.stopPropagation(); deleteNotification(${notif.id})" class="text-red-400 hover:text-red-300 text-xs">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            updateUnreadCount();
        }
        
        // Mark single notification as read
        function markAsRead(id) {
            const notif = notifications.find(n => n.id === id);
            if (notif && !notif.isRead) {
                notif.isRead = true;
                renderNotifications();
            }
        }
        
        // Mark all as read
        function markAllAsRead() {
            notifications.forEach(n => n.isRead = true);
            renderNotifications();
            alert('✅ All notifications marked as read');
        }
        
        // Delete notification
        function deleteNotification(id) {
            notifications = notifications.filter(n => n.id !== id);
            renderNotifications();
            alert('🗑️ Notification deleted');
        }
        
        // Filter notifications
        function filterNotifications(type) {
            currentFilter = type;
            
            // Update active filter button styling
            document.querySelectorAll('[id^="filter"]').forEach(btn => {
                btn.classList.remove('bg-white/20');
                btn.classList.add('text-white/70');
            });
            
            const activeBtn = document.getElementById(`filter${type.charAt(0).toUpperCase() + type.slice(1)}`);
            if (activeBtn) {
                activeBtn.classList.add('bg-white/20');
                activeBtn.classList.remove('text-white/70');
                activeBtn.classList.add('text-white');
            }
            
            renderNotifications();
        }
        
        // Update unread count in title
        function updateUnreadCount() {
            const unreadCount = notifications.filter(n => !n.isRead).length;
            document.title = unreadCount > 0 ? `(${unreadCount}) Notifications | CampusEvent` : 'Notifications | CampusEvent';
        }
        
        // Initial render
        renderNotifications();
        
        // Refresh every 30 seconds (simulate real-time)
        setInterval(() => {
            // Simulate new notification (for demo)
            const hasNew = Math.random() > 0.7;
            if (hasNew) {
                const newNotif = {
                    id: Date.now(),
                    title: 'New Update!',
                    message: 'You have a new message from your team.',
                    type: 'announcement',
                    isRead: false,
                    time: 'Just now',
                    icon: '💬',
                    color: 'from-pink-500 to-rose-500'
                };
                notifications.unshift(newNotif);
                renderNotifications();
            }
        }, 30000);
    </script>
</body>
</html>
