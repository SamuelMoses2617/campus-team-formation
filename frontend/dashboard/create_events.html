<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard | CampusEvent</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }
        
        /* Animated Gradient Background */
        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }
        
        /* Floating bubbles/particles animation */
        @keyframes floatBubble {
            0% {
                transform: translateY(100vh) scale(0.3);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-20vh) scale(1);
                opacity: 0;
            }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        
        @keyframes floatReverse {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(20px) rotate(-5deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }
        
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }
        
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 20px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.6); }
        }
        
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        /* Bubble particle styling */
        .bubble {
            position: fixed;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            pointer-events: none;
            animation: floatBubble linear infinite;
            z-index: 0;
        }
        
        /* Glass Morphism Backgrounds */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .stats-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        /* Status Indicators */
        .status-pending {
            background: #f59e0b;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-approved {
            background: #10b981;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .status-reviewing {
            background: #3b82f6;
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .floating-element { animation: float 6s ease-in-out infinite; }
        .floating-element-reverse { animation: floatReverse 7s ease-in-out infinite; }
        .pulse-element { animation: pulse 3s ease-in-out infinite; }
        .glow-effect { animation: glowPulse 2s ease-in-out infinite; }
        .animate-fade-in { animation: fade-in 0.8s ease-out; }
        
        /* Stats Card Hover */
        .stats-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 40px -12px rgba(0, 0, 0, 0.25);
        }
        
        .stats-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }
        
        .stats-card:hover::before {
            left: 100%;
        }
        
        /* Button Styles */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: 200% auto;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px -10px rgba(102, 126, 234, 0.5);
            background-position: right center;
        }
        
        /* Sidebar Styles */
        .sidebar-item {
            transition: all 0.3s ease;
        }
        
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.1);
            padding-left: 1.75rem;
        }
        
        .sidebar-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-left: 3px solid #667eea;
        }
        
        /* Table Styles */
        .data-table-row {
            transition: all 0.2s ease;
        }
        
        .data-table-row:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                transition: transform 0.3s ease;
                position: fixed;
                z-index: 100;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0 !important;
            }
        }
        
        /* Student initial badge */
        .student-initial {
            width: 2rem;
            height: 2rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 0.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
        }
    </style>
</head>
<body class="animated-bg relative overflow-x-hidden">
    
    <!-- Overlay Gradient for Text Readability -->
  <div class="fixed inset-0 bg-black/30 -z-10"></div>
    
    <!-- Floating Bubbles/Particles - LITTLE BUBBLES RESTORED -->
    <div id="bubblesContainer" class="fixed inset-0 overflow-hidden pointer-events-none z-0"></div>
    
    <!-- Floating Background Shapes -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="absolute top-20 left-10 w-32 h-32 bg-white/10 rounded-full blur-2xl floating-element"></div>
        <div class="absolute bottom-20 right-10 w-40 h-40 bg-purple-500/20 rounded-full blur-2xl floating-element-reverse"></div>
        <div class="absolute top-1/3 right-1/4 w-24 h-24 bg-pink-500/20 rounded-full blur-2xl floating-element" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-1/3 left-1/3 w-28 h-28 bg-blue-500/20 rounded-full blur-2xl floating-element-reverse" style="animation-delay: 3s;"></div>
    </div>
    
    <!-- Dashboard Container -->
    <div class="min-h-screen flex relative z-10">
        
        <!-- SIDEBAR -->
        <aside class="sidebar w-72 glass-card fixed h-full overflow-y-auto shadow-2xl z-20 transition-all duration-300">
            <div class="p-6">
                <!-- Logo - Text only -->
                <div class="mb-8">
                    <span class="text-xl font-bold text-white">CampusEvent</span>
                    <p class="text-xs text-white/60">Faculty Portal</p>
                </div>
                
                <!-- Faculty Info Card -->
                <div class="glass-card rounded-xl p-4 mb-6">
                    <div class="mb-3">
                        <h3 id="facSidebarName" class="font-bold text-white text-lg">Faculty</h3>
                        <p id="facSidebarDept" class="text-xs text-white/60">Department</p>
                    </div>
                    <div class="flex items-center justify-between text-sm">
                        <span class="text-white/50">Faculty ID:</span>
                        <span id="facSidebarId" class="font-semibold text-white">--</span>
                    </div>
                </div>
                
                <!-- Navigation Menu -->
                <div class="space-y-1">
                    <button onclick="setActivePage('dashboard')" class="sidebar-item active w-full text-left px-4 py-3 rounded-xl text-white font-medium" id="nav-dashboard">
                        Dashboard
                    </button>
                    <button onclick="setActivePage('manage')" class="sidebar-item w-full text-left px-4 py-3 rounded-xl text-white/70 hover:text-white font-medium" id="nav-manage">
                        Manage Events
                    </button>
                    <button onclick="setActivePage('create')" class="sidebar-item w-full text-left px-4 py-3 rounded-xl text-white/70 hover:text-white font-medium" id="nav-create">
                        Create Event
                    </button>
                    <button onclick="setActivePage('registrations')" class="sidebar-item w-full text-left flex items-center justify-between px-4 py-3 rounded-xl text-white/70 hover:text-white font-medium" id="nav-registrations">
                        <span>Registrations</span>
                        <span id="badgeRegistrations" class="bg-yellow-500 text-white text-xs px-2 py-1 rounded-full">0</span>
                    </button>
                    <button onclick="setActivePage('teams')" class="sidebar-item w-full text-left flex items-center justify-between px-4 py-3 rounded-xl text-white/70 hover:text-white font-medium" id="nav-teams">
                        <span>Teams</span>
                        <span id="badgeTeams" class="bg-green-500 text-white text-xs px-2 py-1 rounded-full">0</span>
                    </button>
                    <button onclick="setActivePage('notifications')" class="sidebar-item w-full text-left flex items-center justify-between px-4 py-3 rounded-xl text-white/70 hover:text-white font-medium" id="nav-notifications">
                        <span>Notifications</span>
                        <span id="badgeNotifications" class="bg-red-500 text-white text-xs px-2 py-1 rounded-full pulse-element">0</span>
                    </button>
                    <button onclick="setActivePage('settings')" class="sidebar-item w-full text-left px-4 py-3 rounded-xl text-white/70 hover:text-white font-medium" id="nav-settings">
                        Settings
                    </button>
                   
                </div>
                
                <!-- Logout Button -->
                <div class="mt-8 pt-6 border-t border-white/10">
                    <button onclick="logout()" class="w-full text-left px-4 py-3 rounded-xl text-red-400 hover:text-red-300 hover:bg-red-500/10 font-medium">
                        Logout
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- MAIN CONTENT -->
        <main class="flex-1 ml-72 p-8 main-content">

         <h1 class="text-3xl font-bold text-white mb-6">
    Create Event
</h1>

<div class="glass-card p-6 rounded-2xl max-w-2xl">
                    <input id="evTitle" type="text"
           placeholder="Event Name"
           class="w-full p-3 rounded mb-4 text-black">

    <textarea id="evDesc"
    placeholder="Description"
    rows="5"
    class="w-full p-3 rounded mb-4 text-black"></textarea>

    <input id="evDate" type="date"
           class="w-full p-3 rounded mb-4 text-black">
    
    <input id="evLocation" type="text" placeholder="Location (optional)"
           class="w-full p-3 rounded mb-4 text-black">

 <button onclick="submitEvent()"
        class="btn-primary w-full px-6 py-3 rounded-xl text-white">
    Create Event
</button>
</div>
</main>
    </div>
    
    <script>
        // Create floating bubbles/particles
        function createBubbles() {
            const container = document.getElementById('bubblesContainer');
            if (!container) return;
            
            const bubbleCount = 60;
            
            for (let i = 0; i < bubbleCount; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'bubble';
                
                // Random size between 3px and 25px
                const size = Math.random() * 22 + 3;
                bubble.style.width = size + 'px';
                bubble.style.height = size + 'px';
                
                // Random position
                bubble.style.left = Math.random() * 100 + '%';
                
                // Random animation duration between 6 and 20 seconds
                const duration = Math.random() * 14 + 6;
                bubble.style.animationDuration = duration + 's';
                
                // Random delay
                bubble.style.animationDelay = Math.random() * 10 + 's';
                
                // Random opacity
                bubble.style.background = `rgba(255, 255, 255, ${Math.random() * 0.4 + 0.1})`;
                
                container.appendChild(bubble);
            }
        }
        
        function setActivePage(page) {
    document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
    const activeItem = document.getElementById(`nav-${page}`);
    if (activeItem) activeItem.classList.add('active');

    const map = { dashboard:"pages/facultydashboard.html", manage:"pages/manage_events.html", create:"create_events.html", registrations:"pages/registrations.html", teams:"pages/teams.html", notifications:"pages/notifications.html", settings:"pages/settings.html" };
    if (map[page]) window.location.href = map[page];
}
        
        
        // Initialize bubbles
        createBubbles();
        
        // Load faculty info from localStorage
        (function initFacultySidebar() {
            const name = localStorage.getItem("userName") || "Faculty";
            const email = localStorage.getItem("userEmail") || "";
            document.getElementById("facSidebarName").textContent = name;
            document.getElementById("facSidebarDept").textContent = email;
            document.getElementById("facSidebarId").textContent = localStorage.getItem("userId")?.slice(0,8) || "--";
        })();
        
        // Scroll reveal animation
        const observerOptions = { threshold: 0.1, rootMargin: '0px 0px -50px 0px' };
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.style.opacity = '1';
                    entry.target.style.transform = 'translateY(0)';
                }
            });
        }, observerOptions);
        
        document.querySelectorAll('main .stats-card, main .glass-card').forEach(el => {
            el.style.opacity = '0';
            el.style.transform = 'translateY(30px)';
            el.style.transition = 'all 0.6s ease-out';
            observer.observe(el);
        });
    </script>
     <script>

function reviewRegistration(studentName) {
    alert(`Reviewing registration for ${studentName}`);
}

function viewProfile(studentName) {
    alert(`Viewing profile of ${studentName}`);
}

function viewAllRegistrations() {
    window.location.href = "pages/registrations.html";
}

function createEvent() {
    window.location.href = "create_events.html";
}

function exportData() {
    alert("Exporting data...");
}

function formTeams() {
    window.location.href = "pages/teams.html";
}

function logout() {
    if (confirm("Are you sure you want to logout?")) {
        localStorage.clear();
        window.location.href = "../login.html";
    }
}

const API = "/api";
function token() { return localStorage.getItem("token"); }

async function submitEvent() {
    const title = document.getElementById("evTitle")?.value;
    const description = document.getElementById("evDesc")?.value;
    const date = document.getElementById("evDate")?.value;
    const location = document.getElementById("evLocation")?.value || "TBD";

    if (!title || !description || !date) {
        alert("Please fill title, description, and date!");
        return;
    }

    try {
        const res = await fetch(`${API}/events/create`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token()}` },
            body: JSON.stringify({ title, description, date, location })
        });
        const data = await res.json();
        if (res.ok) {
            alert("Event Created Successfully!");
            window.location.href = "pages/facultydashboard.html";
        } else {
            alert(data.message || "Error creating event");
        }
    } catch(e) {
        alert("Server error. Is backend running?");
    }
}

    
       



</script>
<script src="pages/nav.js"></script>
</body>
</html>
