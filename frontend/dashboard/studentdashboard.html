<!DOCTYPE html>
<html lang="en">

    <style>
        * { font-family: 'Inter', sans-serif; }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.2);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }
        
        .stat-card:hover::before {
            left: 100%;
        }
        
        .event-item {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .event-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }
        
        .sidebar-item {
            transition: all 0.3s ease;
            cursor: pointer;
            border-radius: 0.75rem;
        }
        
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .sidebar-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-left: 3px solid #667eea;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }
        
        .btn-outline {
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        /* Team Member */
        .team-member {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .team-member:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        /* Chat Message */
        .message-sent {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 1.5rem 1.5rem 0.5rem 1.5rem;
        }
        
        .message-received {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 1.5rem 1.5rem 1.5rem 0.5rem;
        }
        
        .animate-message {
            animation: message-pop 0.3s ease-out;
        }
        
        @keyframes message-pop {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        
        .animate-bounce {
            animation: bounce 1.4s infinite;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; }
        
        @media (max-width: 768px) {
            .sidebar-mobile { display: none; }
        }
    </style>
</head>

        // Chat Functions

            const modal = document.getElementById('chatModal');

        function closeChatModal() {

        function renderChatMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = chatMessages.map(msg => `
                <div class="flex items-start gap-3 ${msg.type === 'sent' ? 'justify-end' : ''} animate-message">
                    ${msg.type !== 'sent' ? `
                        <div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full flex items-center justify-center text-white text-xs font-bold">
                            ${msg.sender.charAt(0)}
                        </div>
                    ` : ''}
                    <div class="${msg.type === 'sent' ? 'text-right' : ''}" style="max-width: 70%;">
                        ${msg.type !== 'sent' ? `
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-white font-semibold text-sm">${msg.sender}</span>
                                <span class="text-white/40 text-xs">${msg.time}</span>
                            </div>
                        ` : ''}
                        <div class="${msg.type === 'sent' ? 'message-sent' : 'message-received'} p-3">
                            <p class="text-white/90 text-sm">${msg.text}</p>
                        </div>
                        ${msg.type === 'sent' ? `
                            <div class="flex items-center justify-end gap-2 mt-1">
                                <span class="text-white/40 text-xs">${msg.time}</span>
                                <span class="text-white font-semibold text-sm">You</span>
                            </div>
                        ` : ''}
                    </div>
                    ${msg.type === 'sent' ? `
                        <div class="w-8 h-8 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-full flex items-center justify-center text-white text-xs font-bold">
                            Y
                        </div>
                    ` : ''}
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }
        
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const newMessage = {
                id: chatMessages.length + 1,
                sender: 'You',
                text: message,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                type: 'sent'
            };
            
            chatMessages.push(newMessage);
            renderChatMessages();
            input.value = '';
            
            // Simulate reply after 2 seconds
            setTimeout(() => {
                const replies = ['Great point!', 'I agree!', 'Let me check on that.', 'Thanks for sharing!'];
                const randomReply = replies[Math.floor(Math.random() * replies.length)];
                const replyMessage = {
                    id: chatMessages.length + 1,
                    sender: 'John David',
                    text: randomReply,
                    time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                    type: 'received'
                };
                chatMessages.push(replyMessage);
                renderChatMessages();
            }, 2000);
        }
