<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard | CampusEvent</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        * { font-family: 'Inter', sans-serif; }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .animated-bg {
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 1rem;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 30px -12px rgba(0, 0, 0, 0.2);
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: left 0.5s;
        }
        
        .stat-card:hover::before {
            left: 100%;
        }
        
        .event-item {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .event-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }
        
        .sidebar-item {
            transition: all 0.3s ease;
            cursor: pointer;
            border-radius: 0.75rem;
        }
        
        .sidebar-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateX(5px);
        }
        
        .sidebar-item.active {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.2), rgba(118, 75, 162, 0.2));
            border-left: 3px solid #667eea;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4);
        }
        
        .btn-outline {
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal.active {
            display: flex;
        }
        
        /* Team Member */
        .team-member {
            transition: all 0.2s ease;
            cursor: pointer;
        }
        
        .team-member:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        /* Chat Message */
        .message-sent {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 1.5rem 1.5rem 0.5rem 1.5rem;
        }
        
        .message-received {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 1.5rem 1.5rem 1.5rem 0.5rem;
        }
        
        .animate-message {
            animation: message-pop 0.3s ease-out;
        }
        
        @keyframes message-pop {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-5px); }
        }
        
        .animate-bounce {
            animation: bounce 1.4s infinite;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; }
        
        @media (max-width: 768px) {
            .sidebar-mobile { display: none; }
        }
    </style>
</head>
<body class="animated-bg min-h-screen">
    
    <div class="flex min-h-screen">
        
        <!-- Sidebar -->
        <aside class="sidebar w-72 glass-card fixed h-full overflow-y-auto shadow-2xl z-20">
            <div class="p-6">
                <!-- Logo -->
                <div class="flex items-center gap-3 mb-8 cursor-pointer group">
                    <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-2.5 rounded-xl transform group-hover:rotate-6 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
                            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
                        </svg>
                    </div>
                    <div>
                        <span class="text-xl font-bold text-white">CampusEvent</span>
                        <p class="text-xs text-white/60">Student Portal</p>
                    </div>
                </div>
                
                <!-- User Info -->
                <div class="glass-card rounded-xl p-4 mb-6">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-12 h-12 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-xl flex items-center justify-center text-white font-bold text-lg shadow-md">
                            <span id="userInitials">?</span>
                        </div>
                        <div>
                            <h3 id="sidebarName" class="font-bold text-white">Loading...</h3>
                            <p id="sidebarDetail" class="text-xs text-white/60">Loading...</p>
                        </div>
                    </div>
                    <div class="flex items-center justify-between text-xs">
                        <span class="text-white/60">Role:</span>
                        <span id="memberSince" class="font-semibold text-white">Student</span>
                    </div>
                </div>
                
                <!-- Navigation -->
                <div class="space-y-1">
                    <button onclick="showDashboard()" class="sidebar-item active w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-white" id="nav-dashboard">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                        <span class="font-medium">Dashboard</span>
                    </button>
                    <button onclick="showMyTeam()" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-white/80 hover:text-white" id="nav-myteam">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" /></svg>
                        <span class="font-medium">My Team</span>
                    </button>
                    <button onclick="showNotifications()" class="sidebar-item w-full flex items-center justify-between px-4 py-3 rounded-xl transition-all text-white/80 hover:text-white" id="nav-notifications">
                        <div class="flex items-center gap-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                            <span class="font-medium">Notifications</span>
                        </div>
                        <span class="bg-red-500 text-white text-xs px-2 py-1 rounded-full">3</span>
                    </button>
                    <button onclick="showProfile()" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-white/80 hover:text-white" id="nav-profile">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                        <span class="font-medium">Profile</span>
                    </button>
                    <button onclick="showSettings()" class="sidebar-item w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-white/80 hover:text-white" id="nav-settings">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /></svg>
                        <span class="font-medium">Settings</span>
                    </button>
                </div>
                
                <!-- Logout -->
                <div class="mt-8 pt-6 border-t border-white/10">
                    <button onclick="logout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all text-red-400 hover:text-red-300 hover:bg-red-500/10">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" /></svg>
                        <span class="font-medium">Logout</span>
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- Main Content -->
        <main class="flex-1 ml-72 p-8 main-content">
            <div id="mainContent">
                <!-- Dashboard content will be loaded here -->
            </div>
        </main>
    </div>
    
    <!-- Event Details Modal -->
    <div id="eventModal" class="modal">
        <div class="glass-card p-6 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
            <div id="modalContent"></div>
            <div class="flex justify-end mt-4">
                <button onclick="closeModal()" class="btn-outline px-4 py-2 rounded-lg text-white">Close</button>
            </div>
        </div>
    </div>
    
    <!-- Chat Modal -->
    <div id="chatModal" class="modal">
        <div class="glass-card p-0 w-full max-w-4xl mx-4 h-[80vh] flex flex-col">
            <div class="p-4 border-b border-white/10 flex items-center justify-between">
                <h3 class="text-white font-semibold">Team Chat</h3>
                <button onclick="closeChatModal()" class="text-white/60 hover:text-white">✕</button>
            </div>
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            <div class="p-4 border-t border-white/10">
                <div class="flex gap-3">
                    <input type="text" id="chatInput" placeholder="Type a message..." class="flex-1 bg-white/10 border border-white/20 rounded-xl px-4 py-2 text-white placeholder-white/40 focus:outline-none">
                    <button onclick="sendChatMessage()" class="btn-primary px-6 py-2 rounded-xl text-white font-semibold">Send</button>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const API = "/api";
        let userData = {};
        let userEvents = [];
        let userTeams = [];
        let userNotifs = [];
        let chatMessages = [];

        function token() { return localStorage.getItem("token"); }
        function logout() { localStorage.clear(); window.location.href = "../homepage.html"; }

        // Sidebar user info uses localStorage (fast) + profile API (enrich)
        function updateSidebar() {
            const name = localStorage.getItem("userName") || "Student";
            document.getElementById("sidebarName").textContent = name;
            const initials = name.split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase();
            document.getElementById("userInitials").textContent = initials;
        }

        async function loadUserProfile() {
            try {
                const res = await fetch(`${API}/profile`, { headers: { Authorization: `Bearer ${token()}` } });
                if (res.status === 404) return;
                const data = await res.json();
                if (data) {
                    const name = localStorage.getItem("userName") || "Student";
                    document.getElementById("sidebarDetail").textContent = `${data.rollno || ""} ${data.branch ? "• " + data.branch : ""}`;
                    // store for stats
                    userData = data;
                }
            } catch(e) {}
        }

        // Dashboard View
        function showDashboard() {
            setActiveNav('dashboard');
            const name = localStorage.getItem("userName") || "Student";
            const firstName = name.split(" ")[0];
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="animate-fade-in">
                    <div class="mb-8">
                        <h1 class="text-3xl font-bold text-white">Welcome back, ${firstName}!</h1>
                        <p class="text-white/80 text-lg mt-2">Here's what's happening with your events today</p>
                    </div>
                    
                    <!-- Stats Cards -->
                    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                        <div class="stat-card rounded-2xl p-6">
                            <div class="flex items-center justify-between mb-4">
                                <div class="w-12 h-12 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-xl flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                                </div>
                                <span class="text-3xl font-bold text-gray-800" id="statEvents">0</span>
                            </div>
                            <h3 class="text-gray-700 font-semibold">Upcoming Events</h3>
                            <p class="text-gray-500 text-sm mt-1" id="statEventsNext">--</p>
                        </div>
                        
                        <div class="stat-card rounded-2xl p-6">
                            <div class="flex items-center justify-between mb-4">
                                <div class="w-12 h-12 bg-gradient-to-r from-green-500 to-emerald-500 rounded-xl flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                </div>
                                <span class="text-3xl font-bold text-gray-800" id="statRegistered">0</span>
                            </div>
                            <h3 class="text-gray-700 font-semibold">Registered Events</h3>
                            <p class="text-gray-500 text-sm mt-1" id="statRegisteredList">--</p>
                        </div>
                        
                        <div class="stat-card rounded-2xl p-6">
                            <div class="flex items-center justify-between mb-4">
                                <div class="w-12 h-12 bg-gradient-to-r from-purple-500 to-pink-500 rounded-xl flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                                </div>
                                <span class="text-3xl font-bold text-gray-800" id="statTeams">0</span>
                            </div>
                            <h3 class="text-gray-700 font-semibold">My Teams</h3>
                            <p class="text-gray-500 text-sm mt-1" id="statTeamsInfo">--</p>
                        </div>
                        
                        <div class="stat-card rounded-2xl p-6">
                            <div class="flex items-center justify-between mb-4">
                                <div class="w-12 h-12 bg-gradient-to-r from-orange-500 to-red-500 rounded-xl flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                                </div>
                                <span class="text-3xl font-bold text-gray-800" id="statNotifs">0</span>
                            </div>
                            <h3 class="text-gray-700 font-semibold">Notifications</h3>
                            <p class="text-gray-500 text-sm mt-1" id="statNotifsInfo">--</p>
                        </div>
                    </div>
                    
                    <!-- Events Section -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="glass-card rounded-2xl p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h2 class="text-xl font-bold text-white">Your Events</h2>
                                <button onclick="showMyTeam()" class="text-white/60 hover:text-white text-sm">View All</button>
                            </div>
                            <div id="dashboardEvents" class="space-y-3">
                                <div class="text-white/50 text-sm py-4">Loading events...</div>
                            </div>
                        </div>
                        
                        <div class="glass-card rounded-2xl p-6">
                            <h2 class="text-xl font-bold text-white mb-4">Recent Activity</h2>
                            <div id="dashboardActivity" class="space-y-3">
                                <div class="text-white/50 text-sm py-4">Loading activity...</div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
            // Load stats & events after rendering
            loadDashboardStats();
            loadDashboardEvents();
            loadDashboardActivity();
        }

        async function loadDashboardStats() {
            try {
                const regRes = await fetch(`${API}/registrations/my`, { headers: { Authorization: `Bearer ${token()}` } });
                const regs = await regRes.json();
                const approved = regs.filter(r => r.status === "approved");
                const pending = regs.filter(r => r.status === "pending");
                const allRegs = regs;

                document.getElementById("statRegistered").textContent = approved.length;
                document.getElementById("statEvents").textContent = allRegs.length;
                if (approved.length > 0) {
                    document.getElementById("statRegisteredList").textContent = approved.map(r => r.event?.title).filter(Boolean).join(", ").slice(0, 30) + "...";
                }
                if (allRegs.length > 0) {
                    document.getElementById("statEventsNext").textContent = allRegs[0]?.event?.title || "--";
                }

                // My teams count
                const teamRes = await fetch(`${API}/teams`, { headers: { Authorization: `Bearer ${token()}` } });
                const teams = await teamRes.json();
                const myTeams = teams.filter(t => t.members?.some(m => m.studentId === localStorage.getItem("userId")));
                document.getElementById("statTeams").textContent = myTeams.length;
                if (myTeams.length > 0) document.getElementById("statTeamsInfo").textContent = myTeams[0].name;

                // Notifications
                const notifRes = await fetch(`${API}/notifications`, { headers: { Authorization: `Bearer ${token()}` } });
                const notifs = await notifRes.json();
                const unread = notifs.filter(n => !n.read);
                document.getElementById("statNotifs").textContent = unread.length;
                document.getElementById("statNotifsInfo").textContent = unread.length > 0 ? `${unread.length} unread` : "All clear";
            } catch(e) {}
        }

        async function loadDashboardEvents() {
            try {
                const res = await fetch(`${API}/events`, { headers: { Authorization: `Bearer ${token()}` } });
                const events = await res.json();
                const container = document.getElementById("dashboardEvents");
                if (!events || events.length === 0) {
                    container.innerHTML = '<div class="text-white/50 text-sm py-4">No events available</div>';
                    return;
                }
                container.innerHTML = events.slice(0, 5).map(ev => `
                    <div class="event-item flex items-center justify-between p-3 border border-white/10 rounded-xl">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center">
                                <span class="text-white font-bold">E</span>
                            </div>
                            <div>
                                <p class="text-white font-medium">${ev.title}</p>
                                <p class="text-white/50 text-xs">${ev.date ? new Date(ev.date).toLocaleDateString() : "TBD"}</p>
                            </div>
                        </div>
                        <span class="text-xs px-2 py-1 bg-blue-500/20 text-blue-400 rounded-full">View</span>
                    </div>
                `).join("");
            } catch(e) {
                document.getElementById("dashboardEvents").innerHTML = '<div class="text-white/50 text-sm py-4">Could not load events</div>';
            }
        }

        async function loadDashboardActivity() {
            try {
                const res = await fetch(`${API}/notifications`, { headers: { Authorization: `Bearer ${token()}` } });
                const notifs = await res.json();
                const container = document.getElementById("dashboardActivity");
                if (!notifs || notifs.length === 0) {
                    container.innerHTML = '<div class="text-white/50 text-sm py-4">No recent activity</div>';
                    return;
                }
                container.innerHTML = notifs.slice(0, 5).map(n => `
                    <div class="flex items-start gap-3 p-3 bg-white/5 rounded-xl">
                        <div class="w-8 h-8 bg-blue-500/20 rounded-full flex items-center justify-center flex-shrink-0">
                            <span class="text-blue-400 text-xs">${n.type === "team" ? "T" : "N"}</span>
                        </div>
                        <div>
                            <p class="text-white text-sm">${n.message}</p>
                            <p class="text-white/40 text-xs mt-1">${n.createdAt ? new Date(n.createdAt).toLocaleDateString() : ""}</p>
                        </div>
                    </div>
                `).join("");
            } catch(e) {
                document.getElementById("dashboardActivity").innerHTML = '<div class="text-white/50 text-sm py-4">Could not load activity</div>';
            }
        }
        
        // My Team View
        async function showMyTeam() {
            setActiveNav('myteam');
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="animate-fade-in">
                    <div class="mb-8">
                        <h1 class="text-3xl font-bold text-white">My Teams</h1>
                        <p class="text-white/80 text-lg mt-2">Teams you are a member of</p>
                    </div>
                    <div id="myTeamsContent">
                        <div class="text-white/50 text-center py-12">Loading teams...</div>
                    </div>
                </div>
            `;
            await loadMyTeamsContent();
        }

        async function loadMyTeamsContent() {
            const container = document.getElementById("myTeamsContent");
            try {
                const userId = localStorage.getItem("userId");
                const res = await fetch(`${API}/teams`, { headers: { Authorization: `Bearer ${token()}` } });
                const allTeams = await res.json();
                const myTeams = allTeams.filter(t => t.members?.some(m => m.studentId === userId || m.student?.id === userId));

                if (myTeams.length === 0) {
                    container.innerHTML = '<div class="text-white/50 text-center py-12">You are not in any team yet.</div>';
                    return;
                }

                container.innerHTML = myTeams.map(team => `
                    <div class="glass-card rounded-2xl overflow-hidden mb-6">
                        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-6">
                            <h2 class="text-2xl font-bold text-white">${team.name}</h2>
                            <p class="text-primary-100 mt-1">${team.event?.title || "Event"}</p>
                        </div>
                        <div class="p-6">
                            <h3 class="text-lg font-semibold text-white mb-4">Members (${team.members?.length || 0})</h3>
                            <div class="space-y-3">
                                ${(team.members || []).map(m => `
                                    <div class="team-member flex items-center justify-between p-3 border border-white/10 rounded-xl">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-full flex items-center justify-center text-white font-bold">
                                                ${(m.student?.name || "?").charAt(0).toUpperCase()}
                                            </div>
                                            <div>
                                                <p class="text-white font-medium">${m.student?.name || "Unknown"}</p>
                                                <p class="text-white/50 text-xs">${m.role || "Member"}</p>
                                            </div>
                                        </div>
                                    </div>
                                `).join("")}
                            </div>
                        </div>
                    </div>
                `).join("");
            } catch(e) {
                container.innerHTML = '<div class="text-white/50 text-center py-12">Error loading teams</div>';
            }
        }
        
        // Notifications View
        async function showNotifications() {
            setActiveNav('notifications');
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="animate-fade-in">
                    <div class="mb-8 flex items-center justify-between">
                        <div>
                            <h1 class="text-3xl font-bold text-white">Notifications</h1>
                            <p class="text-white/80 text-lg mt-2">Stay updated with your events and team updates</p>
                        </div>
                        <button onclick="markAllRead()" class="btn-outline px-4 py-2 rounded-lg text-white text-sm">Mark All Read</button>
                    </div>
                    <div id="notificationsList" class="space-y-3">
                        <div class="text-white/50 text-center py-12">Loading...</div>
                    </div>
                </div>
            `;
            await loadNotifications();
        }

        async function loadNotifications() {
            const container = document.getElementById("notificationsList");
            try {
                const res = await fetch(`${API}/notifications`, { headers: { Authorization: `Bearer ${token()}` } });
                const notifs = await res.json();
                if (!notifs || notifs.length === 0) {
                    container.innerHTML = '<div class="text-white/50 text-center py-12">No notifications yet</div>';
                    return;
                }
                container.innerHTML = notifs.map(n => `
                    <div class="glass-card p-4 ${!n.read ? 'border-l-4 border-blue-500' : ''}">
                        <div class="flex items-start justify-between">
                            <div class="flex-1">
                                <div class="flex items-center gap-2 mb-1">
                                    <h3 class="font-semibold text-white">${n.type.toUpperCase()}</h3>
                                    ${!n.read ? '<span class="bg-blue-500 text-white text-xs px-2 py-1 rounded-full">New</span>' : ''}
                                </div>
                                <p class="text-white/70 text-sm mb-2">${n.message}</p>
                                <p class="text-white/40 text-xs">${n.createdAt ? new Date(n.createdAt).toLocaleDateString() : ""}</p>
                            </div>
                            ${!n.read ? `<button onclick="markNotifRead('${n.id}')" class="text-white/40 hover:text-white/70 text-sm">Mark read</button>` : ''}
                        </div>
                    </div>
                `).join("");
            } catch(e) {
                container.innerHTML = '<div class="text-white/50 text-center py-12">Error loading notifications</div>';
            }
        }

        async function markNotifRead(id) {
            try {
                await fetch(`${API}/notifications/${id}`, { method: "PUT", headers: { Authorization: `Bearer ${token()}` } });
                await loadNotifications();
            } catch(e) {}
        }

        async function markAllRead() {
            try {
                await fetch(`${API}/notifications/read-all`, { method: "PUT", headers: { Authorization: `Bearer ${token()}` } });
                await loadNotifications();
            } catch(e) {}
        }
        
        // Profile View
        async function showProfile() {
            setActiveNav('profile');
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="animate-fade-in">
                    <div class="mb-8">
                        <h1 class="text-3xl font-bold text-white">My Profile</h1>
                        <p class="text-white/80 text-lg mt-2">View and manage your profile information</p>
                    </div>
                    <div id="profileContent">
                        <div class="text-white/50 text-center py-12">Loading profile...</div>
                    </div>
                </div>
            `;
            await loadProfileContent();
        }

        async function loadProfileContent() {
            const container = document.getElementById("profileContent");
            try {
                const name = localStorage.getItem("userName") || "Student";
                const initials = name.split(" ").map(n => n[0]).join("").slice(0, 2).toUpperCase();
                const res = await fetch(`${API}/profile`, { headers: { Authorization: `Bearer ${token()}` } });
                let data = null;
                if (res.status !== 404) data = await res.json();

                const skills = data?.skills ? data.skills.split(",").map(s => s.trim()) : [];
                container.innerHTML = `
                    <div class="glass-card rounded-2xl overflow-hidden">
                        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 p-8 text-center">
                            <div class="w-24 h-24 mx-auto bg-white rounded-full flex items-center justify-center mb-4">
                                <span class="text-3xl font-bold text-indigo-600">${initials}</span>
                            </div>
                            <h2 class="text-2xl font-bold text-white">${name}</h2>
                            <p class="text-primary-100">${data?.rollno || ""} ${data?.branch ? "• " + data.branch : ""} ${data?.year ? "• " + data.year : ""}</p>
                        </div>
                        <div class="p-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-sm font-medium text-white/60 mb-1">Email</label>
                                    <p class="text-white">${localStorage.getItem("userEmail") || "--"}</p>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-white/60 mb-1">Roll Number</label>
                                    <p class="text-white">${data?.rollno || "--"}</p>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-white/60 mb-1">Branch</label>
                                    <p class="text-white">${data?.branch || "--"}</p>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-white/60 mb-1">Year</label>
                                    <p class="text-white">${data?.year || "--"}</p>
                                </div>
                                ${skills.length > 0 ? `
                                <div class="md:col-span-2">
                                    <label class="block text-sm font-medium text-white/60 mb-2">Skills</label>
                                    <div class="flex flex-wrap gap-2">
                                        ${skills.map(s => `<span class="px-3 py-1 bg-white/10 rounded-full text-white/80 text-sm">${s}</span>`).join("")}
                                    </div>
                                </div>` : ""}
                                ${data?.linkedin || data?.github ? `
                                <div class="md:col-span-2">
                                    <label class="block text-sm font-medium text-white/60 mb-2">Links</label>
                                    <div class="flex gap-4">
                                        ${data?.github ? `<a href="${data.github}" target="_blank" class="text-blue-400 hover:text-blue-300 text-sm">GitHub</a>` : ""}
                                        ${data?.linkedin ? `<a href="${data.linkedin}" target="_blank" class="text-blue-400 hover:text-blue-300 text-sm">LinkedIn</a>` : ""}
                                    </div>
                                </div>` : ""}
                            </div>
                        </div>
                    </div>
                `;
            } catch(e) {
                container.innerHTML = '<div class="text-white/50 text-center py-12">Error loading profile</div>';
            }
        }
        
        // Settings View
        function showSettings() {
            setActiveNav('settings');
            const container = document.getElementById('mainContent');
            container.innerHTML = `
                <div class="animate-fade-in">
                    <div class="mb-8">
                        <h1 class="text-3xl font-bold text-white">Settings</h1>
                        <p class="text-white/80 text-lg mt-2">Manage your account preferences</p>
                    </div>
                    
                    <div class="space-y-4">
                        <!-- Notification Preferences -->
                        <div class="glass-card p-6">
                            <h2 class="text-lg font-semibold text-white mb-4">Notification Preferences</h2>
                            <div class="space-y-3">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-white">Email Notifications</p>
                                        <p class="text-white/40 text-sm">Receive updates via email</p>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="emailNotif" class="sr-only peer" checked>
                                        <div class="w-11 h-6 bg-white/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                                    </label>
                                </div>
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-white">Team Updates</p>
                                        <p class="text-white/40 text-sm">Get notified about team activities</p>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="teamNotif" class="sr-only peer" checked>
                                        <div class="w-11 h-6 bg-white/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                                    </label>
                                </div>
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-white">Event Reminders</p>
                                        <p class="text-white/40 text-sm">Reminders for upcoming events</p>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="eventNotif" class="sr-only peer" checked>
                                        <div class="w-11 h-6 bg-white/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Privacy Settings -->
                        <div class="glass-card p-6">
                            <h2 class="text-lg font-semibold text-white mb-4">Privacy</h2>
                            <div class="space-y-3">
                                <div class="flex items-center justify-between">
                                    <div>
                                        <p class="text-white">Show Online Status</p>
                                        <p class="text-white/40 text-sm">Let others see when you're online</p>
                                    </div>
                                    <label class="relative inline-flex items-center cursor-pointer">
                                        <input type="checkbox" id="onlineStatus" class="sr-only peer" checked>
                                        <div class="w-11 h-6 bg-white/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-all"></div>
                                    </label>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Danger Zone -->
                        <div class="glass-card p-6 border-red-500/30">
                            <h2 class="text-lg font-semibold text-red-400 mb-4">Danger Zone</h2>
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="text-white">Delete Account</p>
                                    <p class="text-white/40 text-sm">Permanently delete your account and all data</p>
                                </div>
                                <button onclick="deleteAccount()" class="px-4 py-2 bg-red-500/20 text-red-400 rounded-lg hover:bg-red-500/30 transition">Delete Account</button>
                            </div>
                        </div>
                        
                        <!-- Save Button -->
                        <div class="flex justify-end">
                            <button onclick="saveSettings()" class="btn-primary px-6 py-3 rounded-xl text-white font-semibold">Save Changes</button>
                        </div>
                    </div>
                </div>
            `;
        }
        
        // Chat Functions
        function openChatModal() {
            const modal = document.getElementById('chatModal');
            renderChatMessages();
            modal.classList.add('active');
        }
        
        function closeChatModal() {
            document.getElementById('chatModal').classList.remove('active');
        }
        
        function renderChatMessages() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = chatMessages.map(msg => `
                <div class="flex items-start gap-3 ${msg.type === 'sent' ? 'justify-end' : ''} animate-message">
                    ${msg.type !== 'sent' ? `
                        <div class="w-8 h-8 bg-gradient-to-r from-blue-500 to-cyan-500 rounded-full flex items-center justify-center text-white text-xs font-bold">
                            ${msg.sender.charAt(0)}
                        </div>
                    ` : ''}
                    <div class="${msg.type === 'sent' ? 'text-right' : ''}" style="max-width: 70%;">
                        ${msg.type !== 'sent' ? `
                            <div class="flex items-center gap-2 mb-1">
                                <span class="text-white font-semibold text-sm">${msg.sender}</span>
                                <span class="text-white/40 text-xs">${msg.time}</span>
                            </div>
                        ` : ''}
                        <div class="${msg.type === 'sent' ? 'message-sent' : 'message-received'} p-3">
                            <p class="text-white/90 text-sm">${msg.text}</p>
                        </div>
                        ${msg.type === 'sent' ? `
                            <div class="flex items-center justify-end gap-2 mt-1">
                                <span class="text-white/40 text-xs">${msg.time}</span>
                                <span class="text-white font-semibold text-sm">You</span>
                            </div>
                        ` : ''}
                    </div>
                    ${msg.type === 'sent' ? `
                        <div class="w-8 h-8 bg-gradient-to-r from-indigo-600 to-purple-600 rounded-full flex items-center justify-center text-white text-xs font-bold">
                            Y
                        </div>
                    ` : ''}
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }
        
        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            if (!message) return;
            
            const newMessage = {
                id: chatMessages.length + 1,
                sender: 'You',
                text: message,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                type: 'sent'
            };
            
            chatMessages.push(newMessage);
            renderChatMessages();
            input.value = '';
        }
        
        // Helper Functions
        function setActiveNav(page) {
            document.querySelectorAll('.sidebar-item').forEach(item => {
                item.classList.remove('active');
                item.classList.remove('bg-white/10');
            });
            document.getElementById(`nav-${page}`).classList.add('active');
            document.getElementById(`nav-${page}`).classList.add('bg-white/10');
        }
        
        function saveSettings() {
            const emailNotif = document.getElementById('emailNotif')?.checked;
            const teamNotif = document.getElementById('teamNotif')?.checked;
            const eventNotif = document.getElementById('eventNotif')?.checked;
            const onlineStatus = document.getElementById('onlineStatus')?.checked;
            
            localStorage.setItem('userSettings', JSON.stringify({ emailNotif, teamNotif, eventNotif, onlineStatus }));
            alert('Settings saved successfully!');
        }
        
        function deleteAccount() {
            if (confirm('Are you sure you want to delete your account? This action cannot be undone!')) {
                alert('Account deleted. Redirecting to home page...');
                logout();
            }
        }
        
        function navigate(page) {
            const map = { events: "../student_events.html", profile: "../student_profiles.html" };
            if (map[page]) window.location.href = map[page];
        }
        
        function closeModal() {
            document.getElementById('eventModal').classList.remove('active');
        }
        
        // Initialize Dashboard
        updateSidebar();
        loadUserProfile();
        showDashboard();
    </script>
</body>
</html>
