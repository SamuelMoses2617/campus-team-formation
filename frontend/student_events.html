<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events | CampusEvent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Inter', sans-serif; }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .animated-bg { background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab); background-size: 400% 400%; animation: gradientShift 15s ease infinite; }
        .glass-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 1rem; }
        .event-card { transition: all 0.3s ease; cursor: pointer; }
        .event-card:hover { transform: translateY(-5px); background: rgba(255, 255, 255, 0.15); }
        .btn-primary { background: linear-gradient(135deg, #667eea, #764ba2); transition: all 0.3s ease; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(102, 126, 234, 0.4); }
        .btn-outline { border: 1px solid rgba(255, 255, 255, 0.3); background: rgba(255, 255, 255, 0.05); transition: all 0.3s ease; }
        .btn-outline:hover { background: rgba(255, 255, 255, 0.15); }
        .category-chip { transition: all 0.2s ease; cursor: pointer; }
        .category-chip.active { background: linear-gradient(135deg, #667eea, #764ba2); color: white; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #667eea, #764ba2); border-radius: 10px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
    </style>
</head>
<body class="animated-bg min-h-screen">
    <div class="container mx-auto px-4 py-6">
        <div class="max-w-7xl mx-auto">
            <!-- Header -->
            <div class="glass-card p-4 mb-6 flex items-center justify-between flex-wrap gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-12 h-12 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl flex items-center justify-center">
                        <span class="text-2xl">📅</span>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold text-white">Events</h1>
                        <p class="text-white/60 text-sm">Register for hackathons, workshops, and more</p>
                    </div>
                </div>
                <div class="flex gap-3 items-center">
                    <input type="text" id="searchInput" placeholder="Search events..." class="bg-white/10 border border-white/20 rounded-xl px-4 py-2 text-white placeholder-white/40 w-48 focus:outline-none">
                    <button onclick="window.location.href='student_profiles.html'" class="btn-outline px-4 py-2 rounded-xl text-white text-sm">My Profile</button>
                    <button onclick="window.location.href='dashboard/studentdashboard.html'" class="btn-outline px-4 py-2 rounded-xl text-white text-sm">Dashboard</button>
                    <button onclick="logout()" class="text-red-400 hover:text-red-300 text-sm font-medium">Logout</button>
                </div>
            </div>

            <!-- Categories -->
            <div class="glass-card p-4 mb-6">
                <div class="flex gap-3 flex-wrap" id="categoriesList">
                    <button onclick="filterByCategory('all', event)" class="category-chip active px-4 py-2 rounded-full text-white/80 text-sm" data-category="all">All Events</button>
                    <button onclick="filterByCategory('hackathon', event)" class="category-chip px-4 py-2 rounded-full text-white/80 text-sm" data-category="hackathon">🏆 Hackathons</button>
                    <button onclick="filterByCategory('workshop', event)" class="category-chip px-4 py-2 rounded-full text-white/80 text-sm" data-category="workshop">📚 Workshops</button>
                    <button onclick="filterByCategory('ideathon', event)" class="category-chip px-4 py-2 rounded-full text-white/80 text-sm" data-category="ideathon">💡 Ideathons</button>
                    <button onclick="filterByCategory('coding', event)" class="category-chip px-4 py-2 rounded-full text-white/80 text-sm" data-category="coding">⚡ Coding</button>
                    <button onclick="filterByCategory('technical', event)" class="category-chip px-4 py-2 rounded-full text-white/80 text-sm" data-category="technical">💻 Technical</button>
                    <button onclick="filterByCategory('expo', event)" class="category-chip px-4 py-2 rounded-full text-white/80 text-sm" data-category="expo">🚀 Expo</button>
                </div>
            </div>

            <!-- Events Grid -->
            <div id="eventsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="text-white/50 text-center py-12 col-span-full">Loading events...</div>
            </div>
        </div>
    </div>

    <!-- Event Details Modal -->
    <div id="eventModal" class="modal">
        <div class="glass-card p-6 w-full max-w-2xl mx-4 max-h-[90vh] overflow-y-auto">
            <div id="modalContent"></div>
            <div class="flex justify-end mt-4">
                <button onclick="closeModal()" class="btn-outline px-4 py-2 rounded-lg text-white">Close</button>
            </div>
        </div>
    </div>

    <script>
        const API = "/api";
        function token() { return localStorage.getItem("token"); }
        function logout() { if (confirm("Logout?")) { localStorage.clear(); window.location.href = "login.html"; } }

        let events = [];
        let currentCategory = 'all';
        let currentSearch = '';
        let myRegistrations = [];

        async function loadEvents() {
            try {
                const res = await fetch(`${API}/events`, { headers: { "Authorization": `Bearer ${token()}` } });
                events = await res.json();

                // Load my registrations
                try {
                    const regRes = await fetch(`${API}/registrations`, { headers: { "Authorization": `Bearer ${token()}` } });
                    myRegistrations = await regRes.json();
                } catch(e) {}

                renderEvents();
            } catch(e) {
                document.getElementById("eventsGrid").innerHTML = '<div class="text-red-400 text-center py-12 col-span-full">Error loading events. Is backend running?</div>';
            }
        }

        function renderEvents() {
            const container = document.getElementById("eventsGrid");
            let filtered = events;

            if (currentCategory !== 'all') {
                filtered = filtered.filter(e => (e.category || e.type || "").toLowerCase() === currentCategory);
            }
            if (currentSearch) {
                filtered = filtered.filter(e =>
                    (e.title || e.name || "").toLowerCase().includes(currentSearch.toLowerCase()) ||
                    (e.description || "").toLowerCase().includes(currentSearch.toLowerCase())
                );
            }

            if (filtered.length === 0) {
                container.innerHTML = '<div class="glass-card p-8 text-center col-span-full"><div class="text-6xl mb-4">🔍</div><h3 class="text-white text-xl font-semibold mb-2">No events found</h3></div>';
                return;
            }

            container.innerHTML = filtered.map(event => {
                const isRegistered = myRegistrations.some(r => r.eventId === event.id);
                return `
                    <div class="glass-card event-card overflow-hidden" onclick="showDetails('${event.id}')">
                        <div class="h-32 bg-gradient-to-r from-blue-500 to-purple-600 flex items-center justify-center relative">
                            <span class="text-6xl">${getIcon(event.category || event.type)}</span>
                            <div class="absolute top-4 right-4 bg-black/50 backdrop-blur-sm px-2 py-1 rounded-lg text-xs font-semibold text-white">
                                ${event._count?.registrations || 0} registered
                            </div>
                        </div>
                        <div class="p-5">
                            <div class="flex items-center justify-between mb-2">
                                <h3 class="text-xl font-bold text-white">${event.title || event.name}</h3>
                                <span class="text-xs px-2 py-1 bg-white/10 rounded-full text-white/70">${event.level || "All Levels"}</span>
                            </div>
                            <p class="text-white/70 text-sm mb-4">${(event.description || "").substring(0, 100)}...</p>
                            <div class="space-y-2 mb-4">
                                <div class="flex items-center gap-2 text-sm text-white/60">
                                    <span>📅</span>
                                    <span>${event.date ? new Date(event.date).toLocaleDateString() : "TBD"}</span>
                                </div>
                                <div class="flex items-center gap-2 text-sm text-white/60">
                                    <span>📍</span>
                                    <span>${event.venue || event.location || "TBD"}</span>
                                </div>
                            </div>
                            <div class="flex gap-3 mt-4">
                                ${isRegistered
                                    ? `<button class="flex-1 bg-green-500/20 text-green-400 px-4 py-2 rounded-xl text-sm font-semibold cursor-default" disabled>✓ Registered</button>`
                                    : `<button onclick="event.stopPropagation(); registerForEvent('${event.id}')" class="flex-1 btn-primary px-4 py-2 rounded-xl text-white text-sm font-semibold">Register</button>`
                                }
                                <button onclick="event.stopPropagation(); showDetails('${event.id}')" class="flex-1 btn-outline px-4 py-2 rounded-xl text-white text-sm font-semibold">Details</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getIcon(type) {
            const icons = { hackathon: "🏆", workshop: "📚", ideathon: "💡", coding: "⚡", technical: "💻", expo: "🚀" };
            return icons[type] || "📅";
        }

        function filterByCategory(category, evt) {
            currentCategory = category;
            document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
            evt.target.classList.add('active');
            renderEvents();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            currentSearch = e.target.value;
            renderEvents();
        });

        async function showDetails(eventId) {
            const event = events.find(e => e.id === eventId);
            if (!event) return;
            const isRegistered = myRegistrations.some(r => r.eventId === event.id);

            const modal = document.getElementById('eventModal');
            document.getElementById('modalContent').innerHTML = `
                <div class="mb-4">
                    <div class="h-40 bg-gradient-to-r from-blue-500 to-purple-600 rounded-xl flex items-center justify-center mb-4">
                        <span class="text-7xl">${getIcon(event.category || event.type)}</span>
                    </div>
                    <h2 class="text-2xl font-bold text-white mb-2">${event.title || event.name}</h2>
                    <p class="text-white/80 mb-6">${event.description || ""}</p>
                    <div class="space-y-3 mb-6">
                        <div class="flex items-center gap-3 text-white/70"><span class="w-24">📅 Date:</span><span>${event.date ? new Date(event.date).toLocaleDateString() : "TBD"}</span></div>
                        <div class="flex items-center gap-3 text-white/70"><span class="w-24">📍 Venue:</span><span>${event.venue || event.location || "TBD"}</span></div>
                        <div class="flex items-center gap-3 text-white/70"><span class="w-24">📊 Registered:</span><span>${event._count?.registrations || 0} students</span></div>
                    </div>
                    ${isRegistered
                        ? `<button class="w-full bg-green-500/20 text-green-400 py-3 rounded-xl font-semibold cursor-default" disabled>✓ You are registered</button>`
                        : `<button onclick="registerForEvent('${event.id}'); closeModal();" class="w-full btn-primary py-3 rounded-xl text-white font-semibold">Register Now</button>`
                    }
                </div>
            `;
            modal.classList.add('active');
        }

        async function registerForEvent(eventId) {
            try {
                const res = await fetch(`${API}/registrations`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token()}` },
                    body: JSON.stringify({ eventId })
                });
                const data = await res.json();
                if (res.ok) {
                    alert("✅ Registered successfully!");
                    myRegistrations.push({ eventId });
                    renderEvents();
                } else {
                    alert(data.message);
                }
            } catch(e) {
                alert("Server error. Is backend running?");
            }
        }

        function closeModal() { document.getElementById('eventModal').classList.remove('active'); }
        window.onclick = function(e) { const m = document.getElementById('eventModal'); if (e.target === m) closeModal(); }

        loadEvents();
    </script>
</body>
</html>
