services:
  - type: web
    name: campus-event-formation
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: campus-event-db
          property: connectionString
      - key: JWT_SECRET
        value: campus_event_secret_key

databases:
  - name: campus-event-db
    plan: free
    region: oregon
